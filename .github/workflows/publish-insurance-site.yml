name: Publish Insurance Analysis

on:
  workflow_dispatch:
  schedule:
    # 09:00 IST on 21 February every year.
    - cron: "30 3 21 2 *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Refresh insurance data and build static site
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python -m insurance_pipeline.build_insurance_site --require-current-cycle
          else
            python -m insurance_pipeline.build_insurance_site
          fi

      - name: Commit generated insurance files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update insurance analysis website"
          file_pattern: insurance/Insurance_Analysis.xlsx insurance/data.json
