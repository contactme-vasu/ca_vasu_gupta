name: Remind RBI T-Bill Update

on:
  workflow_dispatch:
  schedule:
    # One day before the index analysis refresh on April 5 and October 5.
    - cron: "30 3 4 4,10 *"

permissions:
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest

    steps:
      - name: Create or update RBI workbook reminder issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Reminder: update RBI 364-day T-Bill workbook before index analysis refresh";
            const sourceUrl = "https://data.rbi.org.in/BOE/OpenDocument/2409211840/OpenDocument/opendoc/openDocument.jsp?logonSuccessful=true&shareId=3";
            const workbookPath = "Auctions of 364-Day Government of India Treasury Bills.xlsx";
            const body = [
              "The scheduled Index Funds Analysis refresh runs tomorrow.",
              "",
              "Please update the RBI 364-day Treasury Bills workbook before the analysis workflow runs.",
              "",
              `RBI source: ${sourceUrl}`,
              "",
              "Steps:",
              `1. Open the RBI source link and download/export the latest 364-day Government of India Treasury Bills auction data.`,
              `2. Replace the repository file: \`${workbookPath}\`.`,
              "3. Commit and push the updated workbook to `main`.",
              "4. After updating, either wait for the scheduled `Publish Index Analysis` workflow or run it manually from GitHub Actions.",
              "",
              "This workbook is used for Sharpe Ratio and Sortino Ratio calculations."
            ].join("\n");

            const query = `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${title}"`;
            const existing = await github.rest.search.issuesAndPullRequests({ q: query, per_page: 1 });

            if (existing.data.items.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data.items[0].number,
                body
              });
            } else {
              const issue = {
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                assignees: [context.repo.owner]
              };
              try {
                await github.rest.issues.create(issue);
              } catch (error) {
                delete issue.assignees;
                await github.rest.issues.create(issue);
              }
            }
